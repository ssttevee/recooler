name: Test Plugin
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain and components pinned in rust-toolchain.toml and caches cargo
      # artifacts. The empty rustflags stop the action from defaulting to `-D warnings`, so tests
      # build the same way as they do locally.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cargo test
        run: cargo test

      # TODO: make this blocking once the existing clippy::all violations in the crate are fixed.
      # The crate has `#![deny(clippy::all)]`, so today this step fails on lints that predate it.
      - name: Cargo clippy
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Node tests
        run: pnpm run test

  call-rust-build:
    uses: ./.github/workflows/build.yaml

  test-artifacts:
    name: Test Artifacts
    needs: [call-rust-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # batch download artifacts
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: Check Artifacts
        run: |
          for abi in linux-x64-gnu linux-x64-musl darwin-x64 win32-x64-msvc linux-arm64-musl linux-arm64-gnu darwin-arm64 win32-ia32-msvc win32-arm64-msvc
          do
            mv /tmp/artifacts/${{ github.sha }}-${abi}-plugin/* ./npm/${abi}

            test -f ./npm/${abi}/index.farm
          done
      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - name: Install Dependencies
        run: npm install -g pnpm@9.1.0
      - name: Test Example
        run: cd playground && pnpm i && pnpm build
