name: Publish packages and crates
on:
  push:
    branches:
      - main

# the id-token permission that npm's OIDC publish needs is granted to the release job only, so that
# the called CI jobs (dependency installs, cargo build scripts) don't get it
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # builds every platform binary (via build.yaml), runs the cargo and node tests and checks the
  # playground against the linux binary; nothing is published unless all of it passes
  call-ci:
    uses: ./.github/workflows/ci.yaml

  release:
    name: Release
    needs: [call-ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      # batch download the artifacts built by build.yaml inside call-ci
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: Move Artifacts
        run: |
          for abi in linux-x64-gnu linux-x64-musl darwin-x64 win32-x64-msvc linux-arm64-musl linux-arm64-gnu darwin-arm64 win32-ia32-msvc win32-arm64-msvc
          do
            mv /tmp/artifacts/${{ github.sha }}-${abi}-plugin/* ./npm/${abi}

            test -f ./npm/${abi}/index.farm
          done

      - name: Install Dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm i --frozen-lockfile

      - name: Publish to npm
        run: npm publish
